<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="All In One News - বাংলাদেশের সর্বশেষ খবর">
<title>All In One News | বাংলাদেশের খবর</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f2f5fa;color:#172033}
header{background:linear-gradient(135deg,#071b3a,#1261b5);color:white;text-align:center;padding:28px 12px}
header h1{font-size:28px}
header p{margin-top:6px;color:#d5e4ff}
.container{max-width:1100px;margin:22px auto;padding:0 12px}
.tools{display:flex;gap:8px;margin-bottom:20px}
input{width:100%;padding:13px;border:1px solid #ccd5e2;border-radius:9px;font-size:16px}
button{border:0;background:#1261b5;color:white;padding:12px 16px;border-radius:9px;cursor:pointer}
.info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px;color:#52627a;font-size:13px}
h2{font-size:21px;margin-bottom:15px;color:#102b50}
.news-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.card{background:white;border-radius:12px;overflow:hidden;border:1px solid #e5eaf2;box-shadow:0 3px 12px #0000000b}
.card img{width:100%;height:210px;object-fit:cover;display:block;background:#e5eaf2}
.content{padding:15px}
.tag{color:#1261b5;font-size:13px;margin-bottom:8px}
h3{font-size:18px;line-height:1.5;margin-bottom:9px}
h3 a{color:#172b49;text-decoration:none}
h3 a:hover{color:#1261b5}
.date{font-size:12px;color:#8993a5;margin-top:10px}
.message{background:white;padding:25px;text-align:center;border-radius:10px;grid-column:1/-1}
footer{margin-top:35px;background:#071b3a;color:white;text-align:center;padding:22px;font-size:13px}
@media(max-width:650px){
.news-list{grid-template-columns:1fr}
.card img{height:200px}
header h1{font-size:24px}
}
</style>
</head>

<body>
<header>
<h1>All In One News</h1>
<p>বাংলাদেশ ও বিশ্বের সর্বশেষ সংবাদ</p>
</header>

<main class="container">
<div class="tools">
<input id="search" type="search" placeholder="খবর খুঁজুন...">
<button onclick="loadNews()">রিফ্রেশ</button>
</div>

<div class="info">
<span id="total">খবর লোড হচ্ছে...</span>
<span id="updated"></span>
</div>

<h2>সর্বশেষ সংবাদ</h2>
<div id="news" class="news-list">
<div class="message">খবর লোড হচ্ছে...</div>
</div>
</main>

<footer>
<p>খবর পড়ুন, মূল সূত্র যাচাই করুন।</p>
<p>© <span id="year"></span> All In One News</p>
</footer>

<script>
let stories=[];

function safeURL(value){
try{
let u=new URL(value);
return ["https:","http:"].includes(u.protocol)?u.href:"";
}catch(e){return "";}
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
}

async function loadNews(){
const box=document.getElementById("news");
box.innerHTML='<div class="message">খবর লোড হচ্ছে...</div>';

try{
const response=await fetch("./news.json?t="+Date.now());
if(!response.ok)throw new Error("News unavailable");

const data=await response.json();
stories=(data.news||[]).map(item=>({
title:item.title||"শিরোনাম নেই",
source:item.source||"সংবাদ সূত্র",
link:safeURL(item.link),
image:safeURL(item.image),
published:item.published||""
}));

document.getElementById("updated").textContent=
data.updated_at?"আপডেট: "+new Date(data.updated_at).toLocaleString("bn-BD"):"";

renderNews();
}catch(e){
box.innerHTML='<div class="message">খবর লোড হয়নি। পরে আবার চেষ্টা করুন।</div>';
document.getElementById("total").textContent="খবর পাওয়া যায়নি";
}
}

function renderNews(){
const query=document.getElementById("search").value.toLowerCase().trim();
const filtered=stories.filter(x=>
(x.title+" "+x.source).toLowerCase().includes(query)
);

document.getElementById("total").textContent=
"মোট খবর: "+filtered.length+" টি";

if(!filtered.length){
document.getElementById("news").innerHTML=
'<div class="message">কোনো খবর পাওয়া যায়নি।</div>';
return;
}

document.getElementById("news").innerHTML=filtered.map(x=>{
const title=escapeHTML(x.title);
const source=escapeHTML(x.source);
const image=escapeHTML(x.image);
const link=x.link?escapeHTML(x.link):"";
const date=escapeHTML(x.published);

return `
<article class="card">
<img src="${image||"https://placehold.co/800x450?text=News"}"
alt="${title}" loading="lazy"
onerror="this.onerror=null;this.src='https://placehold.co/800x450?text=News'">
<div class="content">
<div class="tag">${source}</div>
<h3>${link?`<a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>`:title}</h3>
<p>মূল সংবাদ সূত্র: ${source}</p>
<div class="date">${date}</div>
</div>
</article>`;
}).join("");
}

document.getElementById("search").addEventListener("input",renderNews);
document.getElementById("year").textContent=new Date().getFullYear();
loadNews();
</script>
</body>
</html>
