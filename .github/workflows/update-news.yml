
name: Update News

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch RSS headlines with images
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          feeds = [
              ('BBC News', 'https://feeds.bbci.co.uk/news/rss.xml'),
              ('BBC World', 'https://feeds.bbci.co.uk/news/world/rss.xml'),
          ]

          items = []

          MEDIA = '{http://search.yahoo.com/mrss/}'
          CONTENT = '{http://purl.org/rss/1.0/modules/content/}'
          ENCLOSURE = 'enclosure'

          def get_image(item):
              for element in item.iter():
                  if element.tag in (MEDIA + 'thumbnail', MEDIA + 'content'):
                      image_url = element.attrib.get('url', '')
                      if image_url.startswith('https://') or image_url.startswith('http://'):
                          return image_url

                  if element.tag == ENCLOSURE:
                      image_url = element.attrib.get('url', '')
                      image_type = element.attrib.get('type', '')
                      if image_url.startswith(('https://', 'http://')) and image_type.startswith('image/'):
                          return image_url

              return ''

          for source, url in feeds:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'AllInOneNews/1.0'}
                  )

                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())

                  for item in root.findall('.//item')[:25]:
                      title = (item.findtext('title') or '').strip()
                      link = (item.findtext('link') or '').strip()
                      date = (item.findtext('pubDate') or '').strip()
                      image = get_image(item)

                      if title and link:
                          items.append({
                              'title': title,
                              'link': link,
                              'source': source,
                              'published': date,
                              'image': image
                          })

              except Exception as e:
                  print(f'Could not fetch {source}: {e}')

          unique = {item['link']: item for item in items}
          items = list(unique.values())[:50]

          data = {
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'news': items
          }

          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f'Saved {len(items)} headlines')
          print(f'Headlines with images: {sum(1 for x in items if x["image"])}')
          PY

      - name: Commit updated headlines
        run: |
          if git diff --quiet -- news.json; then
            echo 'No news changes to commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json
            git commit -m 'Update news headlines and images'
            git push
          fi
