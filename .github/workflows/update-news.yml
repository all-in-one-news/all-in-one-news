name: Update News

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate news collector syntax
        run: python -m py_compile .github/scripts/update_news.py
      - name: Collect categorized country news
        run: |
          python .github/scripts/update_news.py
      - name: Save News
        run: |
          if git diff --quiet -- news.json sitemap.xml articles/; then
            echo "No news changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json sitemap.xml articles/
            git commit -m "Collect country-based categorized news"
            git push
          fi
