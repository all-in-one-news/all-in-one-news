name: Update News

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_news.py'
      - '.github/scripts/test_country_detection.py'
      - '.github/workflows/update-news.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate news collector syntax
        run: python -m py_compile .github/scripts/update_news.py
      - name: Test country detection for Bangla and international headlines
        run: python .github/scripts/test_country_detection.py
      - name: Validate current news and snapshot last known-good data
        run: |
          python - <<'PY'
          import json
          with open('news.json', encoding='utf-8') as f:
              data = json.load(f)
          stories = data.get('news', []) if isinstance(data, dict) else []
          if not stories:
              raise SystemExit('Existing news.json is empty; refusing to replace a missing backup.')
          if any(not str(x.get('image', '')).startswith(('https://', 'http://')) for x in stories):
              raise SystemExit('Existing news.json contains a story without an image; refusing to overwrite it.')
          PY
          cp news.json news-backup.candidate.json
      - name: Collect categorized country news with automatic retry
        run: |
          for attempt in 1 2 3; do
            echo "Collector attempt $attempt of 3"
            if python .github/scripts/update_news.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "All collector attempts failed; the published news remains unchanged."
          exit 1
      - name: Validate generated news and sitemap before publishing
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, xml.etree.ElementTree as ET
          with open('news.json', encoding='utf-8') as f:
              data = json.load(f)
          stories = data.get('news', []) if isinstance(data, dict) else []
          if not stories:
              raise SystemExit('Refusing to publish an empty news feed.')
          if any(not str(x.get('image', '')).startswith(('https://', 'http://')) or x.get('image') == 'https://lh3.googleusercontent.com/J6_coFbogxhRI9iM864NL_liGXvsQp2AupsKei7z0cNNfDvGUmWUy20nuUhkREQyrpY4bEeIBuc=s0-w300' for x in stories):
              raise SystemExit('Refusing to publish a story without an image.')
          # Different articles may legitimately reuse the same publisher image.
          # Duplicate article links are still rejected below.
          canonical_links = [str(x.get('link', '')).strip().split('#', 1)[0].rstrip('/') for x in stories]
          if not all(canonical_links) or len(set(canonical_links)) != len(canonical_links):
              raise SystemExit('Refusing to publish duplicate or empty article links.')
          if any(x.get('language') not in ('bn', 'en') for x in stories):
              raise SystemExit('Every story must have a valid language tag.')
          if any(not x.get('image_verified_at') for x in stories):
              raise SystemExit('Every published image must pass a real image-response check.')
          previous = json.loads(subprocess.check_output(['git', 'show', 'HEAD:news.json'], text=True))
          old_stories = previous.get('news', []) if isinstance(previous, dict) else []
          generic_image = 'https://lh3.googleusercontent.com/J6_coFbogxhRI9iM864NL_liGXvsQp2AupsKei7z0cNNfDvGUmWUy20nuUhkREQyrpY4bEeIBuc=s0-w300'
          old_good_count = sum(1 for x in old_stories if str(x.get('image', '')).startswith(('https://', 'http://')) and x.get('image') != generic_image)
          minimum = max(10, int(old_good_count * 0.20))
          if len(stories) < minimum:
              raise SystemExit(f'Refusing suspicious drop: {len(stories)} stories; minimum {minimum}.')
          raw = pathlib.Path('sitemap.xml').read_text(encoding='utf-8')
          if r'\n' in raw:
              raise SystemExit('Sitemap contains literal backslash-n characters.')
          root = ET.fromstring(raw)
          if not root.tag.endswith('urlset'):
              raise SystemExit('Sitemap root is not urlset.')
          urls = [e.text for e in root.iter() if e.tag.endswith('loc') and e.text]
          if not urls:
              raise SystemExit('Sitemap contains no URLs.')
          for url in urls:
              if '/articles/' in url:
                  rel = url.split('/articles/', 1)[1].strip('/') + '/index.html'
                  if not pathlib.Path('articles', rel).is_file():
                      raise SystemExit('Sitemap points to a missing article page: ' + url)
          print(f'Validated {len(stories)} image-backed stories and {len(urls)} sitemap URLs.')
          with open('publisher_audit.json', encoding='utf-8') as f:
              audit = json.load(f)
          publishers = audit.get('publishers', [])
          domains = [x.get('domain') for x in publishers]
          if audit.get('configured_total') != 200 or len(publishers) != 200 or len(set(domains)) != 200:
              raise SystemExit('Publisher audit must contain exactly 200 unique configured domains.')
          if audit.get('observed_in_rss_total', -1) < 0 or audit.get('not_observed_total', -1) < 0:
              raise SystemExit('Publisher audit counts are invalid.')
          if audit['observed_in_rss_total'] + audit['not_observed_total'] != 200:
              raise SystemExit('Publisher audit totals do not add up to 200.')
          print(f"Validated publisher RSS audit: {audit['observed_in_rss_total']} observed of 200.")
          PY
          if ! cmp -s news-backup.candidate.json news.json; then
            cp news-backup.candidate.json news-backup.json
          fi
          rm -f news-backup.candidate.json
      - name: Save News
        run: |
          git add news.json news-backup.json publisher_audit.json sitemap.xml articles/
          if git diff --cached --quiet; then
            echo "No news changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Collect country-based categorized news"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "Could not rebase onto latest main."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another commit; retrying ($attempt/3)."
              sleep $((attempt * 10))
            done
            echo "Could not push after three synchronized attempts."
            exit 1
          fi
