
name: Update News

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch RSS headlines and images
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone

          feeds = [
              ('BBC News', 'https://feeds.bbci.co.uk/news/rss.xml'),
              ('BBC World', 'https://feeds.bbci.co.uk/news/world/rss.xml'),
          ]

          class ImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.image = ''

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta':
                      return
                  a = dict(attrs)
                  key = (a.get('property') or a.get('name') or '').lower()
                  if key in ('og:image', 'twitter:image') and a.get('content'):
                      self.image = a['content']
          
          def get_image(item):
              image = ''
              for node in item.iter():
                  tag = node.tag.split('}')[-1].lower()
                  if tag in ('thumbnail', 'content', 'enclosure'):
                      image = node.attrib.get('url', '')
                      if image:
                          break

              if image:
                  return image

              link = (item.findtext('link') or '').strip()
              if not link:
                  return ''

              try:
                  req = urllib.request.Request(
                      link,
                      headers={'User-Agent': 'Mozilla/5.0 (compatible; AllInOneNews/1.0)'}
                  )
                  with urllib.request.urlopen(req, timeout=12) as response:
                      html = response.read(500000).decode('utf-8', errors='ignore')

                  parser = ImageParser()
                  parser.feed(html)
                  if parser.image:
                      return urllib.parse.urljoin(link, parser.image)
              except Exception as e:
                  print(f'Image unavailable: {link} - {e}')

              return ''

          items = []

          for source, url in feeds:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'AllInOneNews/1.0'}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())

                  for item in root.findall('.//item')[:25]:
                      title = (item.findtext('title') or '').strip()
                      link = (item.findtext('link') or '').strip()
                      date = (item.findtext('pubDate') or '').strip()

                      if title and link:
                          items.append({
                              'title': title,
                              'link': link,
                              'source': source,
                              'published': date,
                              'rss_item': item
                          })

              except Exception as e:
                  print(f'Could not fetch {source}: {e}')

          def add_image(item):
              item['image'] = get_image(item.pop('rss_item'))
              return item

          with ThreadPoolExecutor(max_workers=8) as executor:
              items = list(executor.map(add_image, items))

          unique = {item['link']: item for item in items}
          news = list(unique.values())[:50]

          data = {
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'news': news
          }

          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f'Saved {len(news)} headlines')
          print(f'Headlines with images: {sum(1 for x in news if x["image"])}')
          PY

      - name: Commit updated headlines
        run: |
          if git diff --quiet -- news.json; then
            echo 'No news changes to commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json
            git commit -m 'Update news headlines and images'
            git push
          fi
