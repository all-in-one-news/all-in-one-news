name: Update News

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect News
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          now = datetime.now(timezone.utc)
          cutoff = datetime(2026, 1, 1, tzinfo=timezone.utc)

          sources = [
              ('প্রথম আলো','prothomalo.com','bn','BD'),
              ('The Daily Star','thedailystar.net','en','BD'),
              ('bdnews24','bdnews24.com','bn','BD'),
              ('BanglaNews24','banglanews24.com','bn','BD'),
              ('যুগান্তর','jugantor.com','bn','BD'),
              ('কালের কণ্ঠ','kalerkantho.com','bn','BD'),
              ('জাগো নিউজ','jagonews24.com','bn','BD'),
              ('ঢাকা পোস্ট','dhakapost.com','bn','BD'),
              ('সমকাল','samakal.com','bn','BD'),
              ('বাংলা ট্রিবিউন','banglatribune.com','bn','BD'),
              ('রাইজিংবিডি','risingbd.com','bn','BD'),
              ('জনকণ্ঠ','dailyjanakantha.com','bn','BD'),
              ('সময় টিভি','somoynews.tv','bn','BD'),
              ('যমুনা টিভি','jamuna.tv','bn','BD'),
              ('চ্যানেল ২৪','channel24bd.tv','bn','BD'),
              ('ইন্ডিপেনডেন্ট টিভি','independent24.com','bn','BD'),
              ('একাত্তর টিভি','ekattor.tv','bn','BD'),
              ('এনটিভি','ntvbd.com','bn','BD'),
              ('নিউজ২৪','news24bd.tv','bn','BD'),

              ('BBC News','bbc.com','en','US'),
              ('BBC','bbc.co.uk','en','US'),
              ('Al Jazeera','aljazeera.com','en','US'),
              ('DW News','dw.com','en','US'),
              ('The Guardian','theguardian.com','en','US'),
              ('France 24','france24.com','en','US'),
              ('Sky News','news.sky.com','en','US'),
              ('Euronews','euronews.com','en','US'),
              ('Reuters','reuters.com','en','US'),
              ('Associated Press','apnews.com','en','US'),
              ('CNN','cnn.com','en','US'),
              ('New York Times','nytimes.com','en','US'),
              ('NHK World','nhk.or.jp','en','US')
          ]

          def make_url(query, lang, country):
              q = urllib.parse.quote(query)

              if lang == 'bn':
                  return (
                      f'https://news.google.com/rss/search?q={q}'
                      '&hl=bn&gl=BD&ceid=BD%3Abn'
                  )

              return (
                  f'https://news.google.com/rss/search?q={q}'
                  f'&hl=en-US&gl={country}&ceid={country}%3Aen'
              )

          feeds = []

          for name, domain, lang, country in sources:
              url = make_url(
                  f'site:{domain} after:2025-12-31',
                  lang,
                  country
              )
              feeds.append((name, url, country))

          feeds += [
              ('BBC Direct','https://feeds.bbci.co.uk/news/rss.xml','WORLD'),
              ('BBC World','https://feeds.bbci.co.uk/news/world/rss.xml','WORLD'),
              ('Al Jazeera','https://www.aljazeera.com/xml/rss/all.xml','WORLD'),
              ('DW Direct','https://rss.dw.com/xml/rss-en-all','WORLD'),
              ('Guardian Direct','https://www.theguardian.com/world/rss','WORLD'),
              ('NY Times','https://rss.nytimes.com/services/xml/rss/nyt/World.xml','WORLD')
          ]

          def local(tag):
              return tag.split('}')[-1].lower()

          def get_text(node, names):
              for child in node.iter():
                  if child is node:
                      continue

                  if local(child.tag) in names:
                      value = ''.join(child.itertext()).strip()

                      if value:
                          return value

              return ''

          def parse_date(value):
              if not value:
                  return None

              try:
                  dt = datetime.fromisoformat(
                      value.replace('Z', '+00:00')
                  )
              except Exception:
                  try:
                      dt = parsedate_to_datetime(value)
                  except Exception:
                      return None

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)

              return dt.astimezone(timezone.utc)

          def fetch_feed(feed):
              source, url, country = feed

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'Mozilla/5.0 AllInOneNews/1.0'
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=25
                  ) as response:
                      root = ET.fromstring(response.read())

                  result = []

                  for node in root.iter():

                      if local(node.tag) not in ('item', 'entry'):
                          continue

                      title = get_text(node, ('title',))

                      link = ''

                      for child in node:
                          if local(child.tag) == 'link':
                              link = (
                                  child.attrib.get('href')
                                  or child.text
                                  or ''
                              ).strip()

                              if link:
                                  break

                      if not link:
                          link = get_text(node, ('link',))

                      date_text = get_text(
                          node,
                          ('pubdate', 'published', 'updated', 'date')
                      )

                      dt = parse_date(date_text)

                      if not title or not link or not dt:
                          continue

                      if dt < cutoff:
                          continue

                      if dt > now + timedelta(hours=2):
                          continue

                      image_url = ''

                      for sub in node.iter():
                          if local(sub.tag) in (
                              'thumbnail',
                              'content',
                              'enclosure'
                          ):
                              candidate = sub.attrib.get('url', '')

                              if candidate.startswith('http'):
                                  image_url = candidate
                                  break

                      result.append({
                          'title': re.sub(r'\s+', ' ', title),
                          'link': link,
                          'source': source,
                          'published': dt.isoformat(),
                          'image': image_url,
                          'country': country
                      })

                  print(source, len(result))

                  return result[:100]

              except Exception as error:
                  print('Feed error:', source, error)
                  return []

          with ThreadPoolExecutor(max_workers=20) as pool:
              batches = list(pool.map(fetch_feed, feeds))

          fresh = [
              item
              for batch in batches
              for item in batch
          ]

          try:
              with open('news.json', encoding='utf-8') as file:
                  previous = json.load(file).get('news', [])
          except Exception:
              previous = []

          merged = {}

          for item in previous + fresh:

              dt = parse_date(item.get('published', ''))
              link = item.get('link', '')

              if not link or not dt:
                  continue

              if dt < cutoff:
                  continue

              if dt > now + timedelta(hours=2):
                  continue

              item['published'] = dt.isoformat()

              old = merged.get(link)

              if old is None:
                  merged[link] = item

              elif not old.get('image') and item.get('image'):
                  merged[link] = item

          news = sorted(
              merged.values(),
              key=lambda x: x['published'],
              reverse=True
          )[:5000]

          data = {
              'updated_at': now.isoformat(),
              'news': news
          }

          with open(
              'news.json',
              'w',
              encoding='utf-8'
          ) as file:
              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print('Total feeds:', len(feeds))
          print('Total news kept since 2026-01-01:', len(news))
          print(
              'News with images:',
              sum(bool(x.get('image')) for x in news)
          )
          PY

      - name: Save News
        run: |
          if git diff --quiet -- news.json; then
            echo "No news changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git add news.json
            git commit -m "Update 2026 news archive"
            git push
          fi