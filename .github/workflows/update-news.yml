name: Update News

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch RSS headlines
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from datetime import datetime, timezone

          feeds = [
              ('BBC News', 'https://feeds.bbci.co.uk/news/rss.xml'),
              ('BBC World', 'https://feeds.bbci.co.uk/news/world/rss.xml'),
          ]
          items = []
          for source, url in feeds:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'AllInOneNews/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())
                  for item in root.findall('.//item')[:25]:
                      title = (item.findtext('title') or '').strip()
                      link = (item.findtext('link') or '').strip()
                      date = (item.findtext('pubDate') or '').strip()
                      if title and link:
                          items.append({'title': title, 'link': link, 'source': source, 'published': date})
              except Exception as e:
                  print(f'Could not fetch {source}: {e}')
          unique = {x['link']: x for x in items}
          items = list(unique.values())[:50]
          data = {'updated_at': datetime.now(timezone.utc).isoformat(), 'news': items}
          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f'Saved {len(items)} headlines')
          PY

      - name: Commit updated headlines
        run: |
          if git diff --quiet -- news.json; then
            echo 'No news changes to commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json
            git commit -m 'Update news headlines'
            git push
          fi
